version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -q -r requirements-dev.txt
  pre_build:
    commands:
      - echo "== Tests =="
      - python -m pytest -q
      - echo "== Validar YAML =="
      - python scripts/validate_yaml.py
      - aws ecr get-login-password --region $AWS_ACCOUNT_REGION | docker login --username AWS --password-stdin ${ECR_REPO_URI%%/*}
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
  build:
    commands:
      - docker build --build-arg APP_VERSION=$IMAGE_TAG -t $ECR_REPO_URI:$IMAGE_TAG .
  post_build:
    commands:
      - docker push $ECR_REPO_URI:$IMAGE_TAG
      - printf '[{"name":"app","imageUri":"%s"}]' $ECR_REPO_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
